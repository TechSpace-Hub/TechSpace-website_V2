<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/techspace-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>The TechSpace | Tech Talent Community, Foundry &amp; Hiring</title>
    <meta
      name="description"
      content="The TechSpace connects tech talents, founders, and brands — explore programs, join the TechSpace Foundry, and hire verified tech talent on demand."
    />
    <link rel="canonical" href="https://www.thetechspaceltd.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#c6382f" />

    <!-- Open Graph (how the site looks when shared on WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The TechSpace" />
    <meta property="og:title" content="The TechSpace | Tech Talent Community, Foundry &amp; Hiring" />
    <meta
      property="og:description"
      content="The TechSpace connects tech talents, founders, and brands — explore programs, join the TechSpace Foundry, and hire verified tech talent on demand."
    />
    <meta property="og:url" content="https://www.thetechspaceltd.com/" />
    <meta property="og:image" content="https://www.thetechspaceltd.com/og-image.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The TechSpace | Tech Talent Community, Foundry &amp; Hiring" />
    <meta
      name="twitter:description"
      content="The TechSpace connects tech talents, founders, and brands — explore programs, join the TechSpace Foundry, and hire verified tech talent on demand."
    />
    <meta name="twitter:image" content="https://www.thetechspaceltd.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: tells Google the company name, logo, contact and social profiles -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.thetechspaceltd.com/#organization",
            "name": "The TechSpace",
            "alternateName": "TechSpace",
            "url": "https://www.thetechspaceltd.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.thetechspaceltd.com/techspace-logo.png"
            },
            "description": "The TechSpace connects tech talents, founders, and brands — explore programs, join the TechSpace Foundry, and hire verified tech talent on demand.",
            "email": "info@thetechspaceltd.com",
            "sameAs": [
              "https://x.com/techspacecomm",
              "https://www.linkedin.com/company/thetechspace/",
              "https://www.instagram.com/techspacecommunity_",
              "https://wa.me/qr/INVHF3KI3RDCO1"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "info@thetechspaceltd.com",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.thetechspaceltd.com/#website",
            "url": "https://www.thetechspaceltd.com/",
            "name": "The TechSpace",
            "publisher": { "@id": "https://www.thetechspaceltd.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
